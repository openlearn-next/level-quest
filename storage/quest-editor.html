<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>课堂闯关 · 课程编辑器</title>
    <script src="/plugin-sandbox/view-bridge.js"></script>
    <style>
      :root {
        --bg: #ffffff;
        --bg-soft: #f8fafc;
        --bg-softer: #f1f5f9;
        --text: #0f172a;
        --muted: #64748b;
        --border: #e2e8f0;
        --border-strong: #cbd5e1;
        --primary: #4f46e5;
        --primary-soft: #eef2ff;
        --primary-border: #c7d2fe;
        --amber: #b45309;
        --amber-soft: #fffbeb;
        --amber-border: #fde68a;
        --emerald: #047857;
        --emerald-soft: #ecfdf5;
        --emerald-border: #a7f3d0;
        --rose: #be123c;
        --rose-soft: #fff1f2;
        --rose-border: #fecdd3;
        --shadow: 0 1px 2px rgba(15, 23, 42, 0.06);
      }
      html[data-theme='dark'] {
        --bg: #0f172a;
        --bg-soft: #111c33;
        --bg-softer: #1e293b;
        --text: #e2e8f0;
        --muted: #94a3b8;
        --border: #1e293b;
        --border-strong: #334155;
        --primary: #818cf8;
        --primary-soft: rgba(99, 102, 241, 0.14);
        --primary-border: rgba(129, 140, 248, 0.4);
        --amber: #fbbf24;
        --amber-soft: rgba(245, 158, 11, 0.12);
        --amber-border: rgba(245, 158, 11, 0.35);
        --emerald: #34d399;
        --emerald-soft: rgba(16, 185, 129, 0.12);
        --emerald-border: rgba(52, 211, 153, 0.35);
        --rose: #fb7185;
        --rose-soft: rgba(244, 63, 94, 0.12);
        --rose-border: rgba(251, 113, 133, 0.35);
        --shadow: 0 1px 2px rgba(0, 0, 0, 0.35);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        background: transparent;
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB',
          'Microsoft YaHei', sans-serif;
        font-size: 13px;
        line-height: 1.5;
      }
      button,
      input,
      select,
      textarea {
        font-family: inherit;
        font-size: 12px;
        color: var(--text);
      }
      .panel {
        border: 1px solid var(--border);
        border-radius: 14px;
        background: var(--bg);
        box-shadow: var(--shadow);
        overflow: hidden;
        margin: 2px 0 4px;
      }
      .head {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 12px;
        cursor: pointer;
        user-select: none;
        background: linear-gradient(90deg, var(--primary-soft), transparent 70%);
      }
      .head:hover {
        background: var(--primary-soft);
      }
      .sword {
        width: 24px;
        height: 24px;
        border-radius: 8px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        background: var(--primary);
        color: #fff;
        font-size: 13px;
        flex: none;
      }
      .title {
        font-weight: 700;
        font-size: 13px;
        letter-spacing: 0.2px;
      }
      .meta {
        color: var(--muted);
        font-size: 11px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        flex: 1;
      }
      .state {
        font-size: 11px;
        font-weight: 600;
        border-radius: 999px;
        padding: 2px 8px;
        border: 1px solid var(--border-strong);
        color: var(--muted);
        white-space: nowrap;
      }
      .state.active {
        color: var(--emerald);
        background: var(--emerald-soft);
        border-color: var(--emerald-border);
      }
      .state.ended {
        color: var(--amber);
        background: var(--amber-soft);
        border-color: var(--amber-border);
      }
      .state.configured {
        color: var(--primary);
        background: var(--primary-soft);
        border-color: var(--primary-border);
      }
      .toggle {
        border: 1px solid var(--border-strong);
        background: var(--bg);
        border-radius: 8px;
        padding: 3px 9px;
        cursor: pointer;
        font-size: 11px;
        font-weight: 600;
        white-space: nowrap;
      }
      .toggle:hover {
        border-color: var(--primary);
        color: var(--primary);
      }
      .body {
        border-top: 1px solid var(--border);
        padding: 12px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .hint {
        font-size: 11px;
        color: var(--muted);
        background: var(--bg-soft);
        border: 1px dashed var(--border-strong);
        border-radius: 10px;
        padding: 8px 10px;
      }
      .banner {
        border-radius: 10px;
        padding: 8px 10px;
        font-size: 12px;
        border: 1px solid var(--border);
        background: var(--bg-soft);
      }
      .banner.warn {
        color: var(--amber);
        background: var(--amber-soft);
        border-color: var(--amber-border);
      }
      .banner.error {
        color: var(--rose);
        background: var(--rose-soft);
        border-color: var(--rose-border);
      }
      .banner.ok {
        color: var(--emerald);
        background: var(--emerald-soft);
        border-color: var(--emerald-border);
      }
      .list {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .level {
        border: 1px solid var(--border);
        border-radius: 10px;
        background: var(--bg);
      }
      .row {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 7px 9px;
      }
      .seq {
        width: 20px;
        height: 20px;
        border-radius: 6px;
        background: var(--primary-soft);
        color: var(--primary);
        font-weight: 700;
        font-size: 11px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        flex: none;
      }
      .ltitle {
        font-weight: 600;
        font-size: 12px;
        flex: 1;
        min-width: 0;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .tag {
        font-size: 10px;
        font-weight: 600;
        border-radius: 999px;
        padding: 1px 7px;
        border: 1px solid var(--border-strong);
        color: var(--muted);
        white-space: nowrap;
      }
      .tag.teacher {
        color: var(--amber);
        background: var(--amber-soft);
        border-color: var(--amber-border);
      }
      .tag.type {
        color: var(--primary);
        background: var(--primary-soft);
        border-color: var(--primary-border);
      }
      .iconbtn {
        border: 1px solid transparent;
        background: transparent;
        border-radius: 7px;
        width: 24px;
        height: 24px;
        cursor: pointer;
        color: var(--muted);
        font-size: 12px;
        line-height: 1;
        flex: none;
      }
      .iconbtn:hover:not(:disabled) {
        border-color: var(--border-strong);
        background: var(--bg-softer);
        color: var(--text);
      }
      .iconbtn:disabled {
        opacity: 0.3;
        cursor: not-allowed;
      }
      .iconbtn.danger:hover:not(:disabled) {
        color: var(--rose);
        border-color: var(--rose-border);
        background: var(--rose-soft);
      }
      .editbox {
        border-top: 1px dashed var(--border);
        padding: 10px;
        display: flex;
        flex-direction: column;
        gap: 8px;
        background: var(--bg-soft);
        border-radius: 0 0 10px 10px;
      }
      .grid2 {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }
      .field {
        display: flex;
        flex-direction: column;
        gap: 3px;
        min-width: 0;
      }
      .field > span {
        font-size: 10px;
        font-weight: 700;
        color: var(--muted);
        letter-spacing: 0.3px;
      }
      input[type='text'],
      select,
      textarea {
        border: 1px solid var(--border-strong);
        border-radius: 8px;
        background: var(--bg);
        padding: 6px 8px;
        width: 100%;
        outline: none;
      }
      input[type='text']:focus,
      select:focus,
      textarea:focus {
        border-color: var(--primary);
        box-shadow: 0 0 0 3px var(--primary-soft);
      }
      textarea {
        resize: vertical;
        min-height: 54px;
        line-height: 1.5;
      }
      textarea.mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 11px;
      }
      input:disabled,
      select:disabled,
      textarea:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }
      .actions {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
      }
      .btn {
        border: 1px solid var(--border-strong);
        background: var(--bg);
        border-radius: 8px;
        padding: 5px 11px;
        cursor: pointer;
        font-size: 12px;
        font-weight: 600;
      }
      .btn:hover:not(:disabled) {
        border-color: var(--primary);
        color: var(--primary);
      }
      .btn.primary {
        background: var(--primary);
        border-color: var(--primary);
        color: #fff;
      }
      .btn.primary:hover:not(:disabled) {
        filter: brightness(1.06);
        color: #fff;
      }
      .btn.ghost {
        border-color: transparent;
        background: transparent;
        color: var(--muted);
      }
      .btn:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }
      .footer {
        display: flex;
        align-items: center;
        gap: 8px;
        padding-top: 2px;
        border-top: 1px solid var(--border);
        margin-top: 2px;
        padding-top: 9px;
      }
      .footer .spacer {
        flex: 1;
      }
      .dirty {
        font-size: 11px;
        color: var(--amber);
        font-weight: 600;
      }
      .empty {
        text-align: center;
        color: var(--muted);
        font-size: 12px;
        padding: 14px 8px;
        border: 1px dashed var(--border-strong);
        border-radius: 10px;
        background: var(--bg-soft);
      }
      .loading {
        color: var(--muted);
        font-size: 12px;
        padding: 10px 2px;
      }
      .checkline {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 12px;
        color: var(--text);
      }
      .checkline input {
        width: auto;
      }
    </style>
  </head>
  <body>
    <div class="panel" id="app">
      <div class="loading">正在载入课堂闯关配置…</div>
    </div>

    <script>
      (function () {
        'use strict';

        var bridge = window.OpenLearnPluginBridge;
        var rawApi = bridge.api;
        var LESSON = '';
        var OPEN_KEY = 'quest-editor-expanded';

        var st = {
          expanded: false,
          loading: true,
          busy: false,
          status: 'idle',
          levels: [],
          error: '',
          notice: '',
          dirty: false,
          editing: null,
          expandedReady: false,
        };

        function authHint(err) {
          var msg = (err && err.message) || '';
          if (/Session expired or invalid|Authentication required/i.test(msg)) {
            return '登录状态已失效：请刷新页面；若仍提示，请退出后重新登录。';
          }
          if (/Role .* not allowed/i.test(msg)) {
            return '当前账号没有教师权限，无法配置课堂闯关。';
          }
          return msg || '请求失败，请稍后重试';
        }
        function guarded(promise) {
          return promise.catch(function (err) {
            throw new Error(authHint(err));
          });
        }
        var api = {
          get: function (path) {
            return guarded(rawApi.get(path));
          },
          post: function (path, body) {
            return guarded(rawApi.post(path, body));
          },
        };

        function el(id) {
          return document.getElementById(id);
        }
        function esc(v) {
          return String(v == null ? '' : v).replace(/[&<>"']/g, function (c) {
            return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
          });
        }
        function letter(i) {
          return String.fromCharCode(65 + i);
        }
        function toast(msg, tone) {
          try {
            bridge.ui.toast(msg, tone || 'info');
          } catch (e) {}
        }
        function resize() {
          try {
            var h = Math.min(920, Math.max(52, document.body.scrollHeight + 4));
            bridge.ui.resize(h);
          } catch (e) {}
        }
        function active() {
          return st.status === 'active';
        }
        function locked() {
          return active();
        }
        function typeLabel(t) {
          return t === 'quiz' ? '答题' : t === 'manual' ? '手动完成' : '作业提交';
        }

        // ── 数据 ──────────────────────────────────────────────────────────
        function hydrate(l) {
          var type = l.type === 'manual' || l.type === 'submission' ? l.type : 'quiz';
          var qt =
            l.questionType === 'multiple' || l.questionType === 'judge' || l.questionType === 'text'
              ? l.questionType
              : 'single';
          var ans = l.answer;
          if (type === 'quiz') {
            if (qt === 'text') ans = typeof ans === 'string' ? ans : '';
            else if (qt === 'multiple') ans = Array.isArray(ans) ? ans.slice() : [];
            else ans = typeof ans === 'number' ? ans : null;
          } else {
            ans = null;
          }
          return {
            key: l.id || 'lv-' + Math.random().toString(16).slice(2, 10),
            id: l.id || null,
            type: type,
            title: l.title || '',
            prompt: l.prompt || '',
            questionType: qt,
            options: Array.isArray(l.options) ? l.options.slice() : [],
            answer: ans,
            needFile: l.needFile === true,
            unlock: l.unlock === 'teacher' ? 'teacher' : 'prev',
          };
        }

        function draftFrom(level) {
          var d = JSON.parse(JSON.stringify(level));
          d.answerText = answerToText(d);
          d.optionsText = (d.options || []).join('\n');
          return d;
        }

        function answerToText(l) {
          if (l.type !== 'quiz') return '';
          if (l.questionType === 'text') return String(l.answer || '');
          if (l.questionType === 'judge') return l.answer === 1 ? '1' : l.answer === 0 ? '0' : '';
          if (l.questionType === 'multiple') {
            return (Array.isArray(l.answer) ? l.answer : [])
              .slice()
              .sort(function (a, b) {
                return a - b;
              })
              .map(letter)
              .join(',');
          }
          return typeof l.answer === 'number' ? letter(l.answer) : '';
        }

        function parseLetters(text, max) {
          var out = [];
          String(text || '')
            .toUpperCase()
            .split(/[\s,，、]+/)
            .forEach(function (part) {
              if (!part) return;
              var n = part.charCodeAt(0) - 65;
              if (n >= 0 && n < max && out.indexOf(n) === -1) out.push(n);
            });
          return out.sort(function (a, b) {
            return a - b;
          });
        }

        function readDraft() {
          var d = st.editing;
          if (!d) return null;
          var out = {
            id: d.id,
            type: d.type,
            title: String(d.title || '').trim(),
            prompt: String(d.prompt || '').trim(),
            unlock: d.unlock === 'teacher' ? 'teacher' : 'prev',
            questionType: d.questionType,
            options: [],
            answer: null,
            needFile: d.needFile === true,
          };
          var lines = String(d.optionsText || '').split('\n');
          while (lines.length && !lines[lines.length - 1].trim()) lines.pop();
          out.options = lines.map(function (x) {
            return x.trim();
          });
          if (out.type === 'quiz') {
            if (out.questionType === 'judge') {
              out.options = ['对', '错'];
              var j = String(d.answerText);
              out.answer = j === '1' || j === '0' ? Number(j) : null;
            } else if (out.questionType === 'text') {
              out.options = [];
              out.answer = String(d.answerText || '').trim();
            } else {
              var picked = parseLetters(d.answerText, out.options.length);
              out.answer = out.questionType === 'multiple' ? picked : picked[0] == null ? null : picked[0];
            }
          }
          return out;
        }

        function validateDraft(level, seq) {
          if (!level.title) return '第 ' + seq + ' 关缺少标题';
          if (level.type !== 'quiz') return '';
          if (level.questionType === 'text') {
            if (!level.answer) return '第 ' + seq + ' 关缺少参考答案';
            return '';
          }
          if (level.questionType === 'judge') {
            if (level.answer !== 0 && level.answer !== 1) return '第 ' + seq + ' 关请选择正确答案';
            return '';
          }
          if (level.options.some(function (x) {
            return !x;
          })) {
            return '第 ' + seq + ' 关存在空选项，请填写或删除该行';
          }
          if (level.options.length < 2) return '第 ' + seq + ' 关至少需要两个选项';
          if (level.options.length > 8) return '第 ' + seq + ' 关的选项不能超过 8 个';
          if (level.questionType === 'multiple') {
            if (!Array.isArray(level.answer) || level.answer.length === 0) return '第 ' + seq + ' 关缺少正确选项';
          } else if (typeof level.answer !== 'number' || level.answer < 0 || level.answer >= level.options.length) {
            return '第 ' + seq + ' 关缺少正确答案';
          }
          return '';
        }

        function toPayload(levels) {
          return levels.map(function (l) {
            var item = { type: l.type, title: l.title, prompt: l.prompt, unlock: l.unlock };
            if (l.id) item.id = l.id;
            if (l.type === 'quiz') {
              item.questionType = l.questionType;
              if (l.questionType === 'judge') {
                item.options = ['对', '错'];
                item.answer = l.answer;
              } else if (l.questionType === 'text') {
                item.answer = l.answer;
              } else {
                item.options = l.options;
                item.answer = l.answer;
              }
            } else if (l.type === 'submission') {
              item.needFile = l.needFile === true;
            }
            return item;
          });
        }

        async function load() {
          if (!LESSON) {
            st.loading = false;
            st.error = '请先在课程编辑器中打开一节课。';
            render();
            return;
          }
          st.loading = true;
          st.error = '';
          render();
          try {
            var data = await api.get('overview?lessonId=' + encodeURIComponent(LESSON));
            st.status = data.status || 'idle';
            st.levels = (data.levels || []).map(hydrate);
            st.dirty = false;
            st.editing = null;
          } catch (err) {
            st.error = (err && err.message) || '加载失败';
          } finally {
            st.loading = false;
            render();
          }
        }

        async function saveAll() {
          if (st.busy || locked()) return;
          if (st.levels.length === 0) {
            st.error = '至少需要一个关卡';
            render();
            return;
          }
          for (var i = 0; i < st.levels.length; i++) {
            var msg = validateDraft(st.levels[i], i + 1);
            if (msg) {
              st.error = msg;
              render();
              return;
            }
          }
          st.busy = true;
          st.error = '';
          render();
          try {
            var res = await api.post('levels', { lessonId: LESSON, levels: toPayload(st.levels) });
            st.levels = (res.levels || []).map(hydrate);
            st.dirty = false;
            st.editing = null;
            st.notice = '已保存 ' + st.levels.length + ' 关，课堂时间线与学生端会立即使用新配置。';
            toast('闯关配置已保存', 'success');
          } catch (err) {
            st.error = (err && err.message) || '保存失败，请重试';
          } finally {
            st.busy = false;
            render();
          }
        }

        // ── 渲染 ─────────────────────────────────────────────────────────
        function statusChip() {
          if (st.status === 'active') return '<span class="state active">进行中</span>';
          if (st.status === 'ended') return '<span class="state ended">已结束</span>';
          if (st.levels.length) return '<span class="state configured">已配置 ' + st.levels.length + ' 关</span>';
          return '<span class="state">未配置</span>';
        }

        function headHtml() {
          var meta = st.loading
            ? '正在载入…'
            : st.levels.length
              ? st.levels.length + ' 关 · ' + st.levels.filter(function (l) {
                  return l.unlock === 'teacher';
                }).length + ' 关需教师放行'
              : '尚未添加关卡，点击展开配置';
          return (
            '<div class="head" data-act="toggle">' +
            '<span class="sword">⚔</span>' +
            '<span class="title">课堂闯关</span>' +
            statusChip() +
            '<span class="meta">' +
            esc(meta) +
            '</span>' +
            '<button class="toggle" type="button" data-act="toggle">' +
            (st.expanded ? '收起' : '展开配置') +
            '</button>' +
            '</div>'
          );
        }

        function editFormHtml(level, index) {
          var d = st.editing;
          var dis = locked() || st.busy;
          var typeSel =
            '<select data-field="type"' +
            (dis ? ' disabled' : '') +
            '>' +
            ['quiz', 'manual', 'submission']
              .map(function (t) {
                return (
                  '<option value="' +
                  t +
                  '"' +
                  (d.type === t ? ' selected' : '') +
                  '>' +
                  typeLabel(t) +
                  '</option>'
                );
              })
              .join('') +
            '</select>';

          var quizFields = '';
          if (d.type === 'quiz') {
            var qtSel =
              '<select data-field="questionType"' +
              (dis ? ' disabled' : '') +
              '>' +
              [
                ['single', '单选'],
                ['multiple', '多选'],
                ['judge', '判断'],
                ['text', '填空'],
              ]
                .map(function (p) {
                  return (
                    '<option value="' +
                    p[0] +
                    '"' +
                    (d.questionType === p[0] ? ' selected' : '') +
                    '>' +
                    p[1] +
                    '</option>'
                  );
                })
                .join('') +
              '</select>';

            quizFields =
              '<div class="grid2">' +
              '<label class="field"><span>题型</span>' +
              qtSel +
              '</label>' +
              '<label class="field"><span>正确答案</span>' +
              (d.questionType === 'judge'
                ? '<select data-field="answerText"' +
                  (dis ? ' disabled' : '') +
                  '><option value=""' +
                  (d.answerText === '' ? ' selected' : '') +
                  '>请选择</option><option value="0"' +
                  (d.answerText === '0' ? ' selected' : '') +
                  '>对</option><option value="1"' +
                  (d.answerText === '1' ? ' selected' : '') +
                  '>错</option></select>'
                : '<input type="text" data-field="answerText" value="' +
                  esc(d.answerText) +
                  '"' +
                  (dis ? ' disabled' : '') +
                  ' placeholder="' +
                  (d.questionType === 'text'
                    ? '参考答案'
                    : d.questionType === 'multiple'
                      ? 'A,C'
                      : 'B') +
                  '" />') +
              '</label>' +
              '</div>' +
              (d.questionType === 'judge'
                ? ''
                : d.questionType === 'text'
                  ? ''
                  : '<label class="field"><span>选项（每行一个，2–8 个）</span><textarea class="mono" data-field="optionsText" rows="4"' +
                    (dis ? ' disabled' : '') +
                    '>' +
                    esc(d.optionsText) +
                    '</textarea></label>');
          }

          var subFields =
            d.type === 'submission'
              ? '<label class="checkline"><input type="checkbox" data-field="needFile"' +
                (d.needFile ? ' checked' : '') +
                (dis ? ' disabled' : '') +
                ' /> 必须上传附件（≤1.5MB）</label>'
              : '';

          return (
            '<div class="editbox">' +
            '<div class="grid2">' +
            '<label class="field"><span>关卡标题</span><input type="text" data-field="title" value="' +
            esc(d.title) +
            '"' +
            (dis ? ' disabled' : '') +
            ' placeholder="例如：第 1 关 · 认识变量" /></label>' +
            '<label class="field"><span>关卡类型</span>' +
            typeSel +
            '</label>' +
            '</div>' +
            '<label class="field"><span>任务说明（可选）</span><textarea data-field="prompt" rows="2"' +
            (dis ? ' disabled' : '') +
            ' placeholder="告诉学生这一关要完成什么">' +
            esc(d.prompt) +
            '</textarea></label>' +
            quizFields +
            subFields +
            '<label class="field"><span>解锁条件</span><select data-field="unlock"' +
            (dis || index === 0 ? ' disabled' : '') +
            '>' +
            (index === 0
              ? '<option value="prev">首关默认解锁（无需条件）</option>'
              : '<option value="prev"' +
                (d.unlock !== 'teacher' ? ' selected' : '') +
                '>完成上一关后解锁</option><option value="teacher"' +
                (d.unlock === 'teacher' ? ' selected' : '') +
                '>教师放行后解锁</option>') +
            '</select></label>' +
            '<div class="actions">' +
            '<button class="btn primary" type="button" data-act="apply"' +
            (dis ? ' disabled' : '') +
            '>确定</button>' +
            '<button class="btn ghost" type="button" data-act="cancel"' +
            (dis ? ' disabled' : '') +
            '>取消</button>' +
            '</div>' +
            '</div>'
          );
        }

        function levelHtml(level, index) {
          var editing = st.editing && st.editing.key === level.key;
          var dis = locked() || st.busy;
          return (
            '<div class="level" data-key="' +
            esc(level.key) +
            '">' +
            '<div class="row">' +
            '<span class="seq">' +
            (index + 1) +
            '</span>' +
            '<span class="ltitle" title="' +
            esc(level.title || '未命名关卡') +
            '">' +
            esc(level.title || '未命名关卡') +
            '</span>' +
            '<span class="tag type">' +
            typeLabel(level.type) +
            '</span>' +
            (index === 0
              ? '<span class="tag">首关</span>'
              : level.unlock === 'teacher'
                ? '<span class="tag teacher">需教师放行</span>'
                : '<span class="tag">完成后解锁</span>') +
            '<button class="iconbtn" type="button" data-act="up" data-i="' +
            index +
            '" title="上移"' +
            (dis || index === 0 || editing ? ' disabled' : '') +
            '>↑</button>' +
            '<button class="iconbtn" type="button" data-act="down" data-i="' +
            index +
            '" title="下移"' +
            (dis || index === st.levels.length - 1 || editing ? ' disabled' : '') +
            '>↓</button>' +
            '<button class="iconbtn" type="button" data-act="edit" data-i="' +
            index +
            '" title="编辑"' +
            (dis || editing ? ' disabled' : '') +
            '>✎</button>' +
            '<button class="iconbtn danger" type="button" data-act="del" data-i="' +
            index +
            '" title="删除"' +
            (dis || editing ? ' disabled' : '') +
            '>✕</button>' +
            '</div>' +
            (editing ? editFormHtml(level, index) : '') +
            '</div>'
          );
        }

        function bodyHtml() {
          var out = '';
          if (st.error) out += '<div class="banner error">' + esc(st.error) + '</div>';
          if (st.notice) out += '<div class="banner ok">' + esc(st.notice) + '</div>';

          if (active()) {
            out +=
              '<div class="banner warn">闯关正在进行中，关卡与解锁条件已锁定。请先在「课堂闯关」页签结束本次闯关，再修改配置。</div>';
          }

          out +=
            '<div class="hint">💡 在课堂时间线中把本环节的「教学形态」设为 <b>课堂闯关</b>，即可标记闯关发生的位置。下方配置对<b>整个课节</b>生效；学生端会在教师开始闯关后显示入口。</div>';

          if (st.loading) {
            out += '<div class="loading">正在载入配置…</div>';
            return out;
          }

          if (st.levels.length === 0) {
            out += '<div class="empty">还没有关卡。添加第一关后，学生在课堂上就能按顺序闯关。</div>';
          } else {
            out +=
              '<div class="list">' +
              st.levels
                .map(function (l, i) {
                  return levelHtml(l, i);
                })
                .join('') +
              '</div>';
          }

          out +=
            '<div class="actions">' +
            '<button class="btn" type="button" data-act="add"' +
            (locked() || st.busy || st.editing ? ' disabled' : '') +
            '>＋ 添加关卡</button>' +
            '</div>';

          out +=
            '<div class="footer">' +
            '<span class="dirty">' +
            (st.dirty ? '有未保存的修改' : '') +
            '</span>' +
            '<span class="spacer"></span>' +
            (st.dirty
              ? '<button class="btn ghost" type="button" data-act="discard"' +
                (st.busy ? ' disabled' : '') +
                '>放弃修改</button>'
              : '') +
            '<button class="btn primary" type="button" data-act="save"' +
            (locked() || st.busy || !st.dirty ? ' disabled' : '') +
            '>' +
            (st.busy ? '保存中…' : '保存闯关配置') +
            '</button>' +
            '</div>';
          return out;
        }

        function render() {
          var app = el('app');
          if (!app) return;
          app.innerHTML = headHtml() + (st.expanded ? '<div class="body">' + bodyHtml() + '</div>' : '');
          resize();
        }

        // ── 交互 ─────────────────────────────────────────────────────────
        function move(i, delta) {
          var j = i + delta;
          if (j < 0 || j >= st.levels.length) return;
          var tmp = st.levels[i];
          st.levels[i] = st.levels[j];
          st.levels[j] = tmp;
          st.dirty = true;
          render();
        }

        function startEdit(i) {
          var l = st.levels[i];
          if (!l) return;
          st.editing = draftFrom(l);
          st.editing.key = l.key;
          st.editing.index = i;
          st.notice = '';
          render();
        }

        function applyEdit() {
          var d = st.editing;
          if (!d) return;
          var lvl = readDraft();
          var seq = d.index + 1;
          var msg = validateDraft(lvl, seq);
          if (msg) {
            st.error = msg;
            render();
            return;
          }
          var target = st.levels[d.index];
          target.type = lvl.type;
          target.title = lvl.title;
          target.prompt = lvl.prompt;
          target.questionType = lvl.questionType;
          target.options = lvl.options;
          target.answer = lvl.answer;
          target.needFile = lvl.needFile;
          target.unlock = lvl.unlock;
          st.editing = null;
          st.error = '';
          st.dirty = true;
          render();
        }

        function addLevel() {
          var n = st.levels.length + 1;
          var fresh = {
            id: null,
            key: 'new-' + Date.now() + '-' + Math.random().toString(16).slice(2, 6),
            type: 'quiz',
            title: '',
            prompt: '',
            questionType: 'single',
            options: ['', '', ''],
            answer: null,
            needFile: false,
            unlock: 'prev',
          };
          st.levels.push(fresh);
          st.dirty = true;
          st.error = '';
          startEdit(st.levels.length - 1);
        }

        function bindEvents() {
          document.addEventListener('click', function (ev) {
            var btn = ev.target.closest('[data-act]');
            if (!btn) return;
            var act = btn.getAttribute('data-act');
            var i = Number(btn.getAttribute('data-i'));

            if (act === 'toggle') {
              st.expanded = !st.expanded;
              st.notice = '';
              render();
              try {
                bridge.storage.set(OPEN_KEY, st.expanded ? '1' : '0');
              } catch (e) {}
              return;
            }
            if (st.busy) return;

            if (act === 'add') addLevel();
            else if (act === 'edit') startEdit(i);
            else if (act === 'up') move(i, -1);
            else if (act === 'down') move(i, 1);
            else if (act === 'del') {
              st.levels.splice(i, 1);
              st.dirty = true;
              st.error = '';
              render();
            } else if (act === 'apply') applyEdit();
            else if (act === 'cancel') {
              st.editing = null;
              st.error = '';
              render();
            } else if (act === 'save') saveAll();
            else if (act === 'discard') {
              st.editing = null;
              st.notice = '';
              load();
            }
          });

          document.addEventListener('input', onField);
          document.addEventListener('change', onField);

          function onField(ev) {
            var field = ev.target.getAttribute && ev.target.getAttribute('data-field');
            if (!field || !st.editing) return;
            var v = ev.target.type === 'checkbox' ? ev.target.checked : ev.target.value;
            st.editing[field] = v;
            if (field === 'questionType' || field === 'type') {
              // 切换题型/类型需要重建表单字段
              st.editing.answerText = '';
              render();
            }
          }
        }

        // ── 启动 ─────────────────────────────────────────────────────────
        async function boot(ctx) {
          var next = (ctx && ctx.lessonId) || '';
          if (next === LESSON && st.expandedReady) return;
          LESSON = next;
          st.expandedReady = true;
          try {
            var saved = await bridge.storage.get(OPEN_KEY);
            st.expanded = saved === '1' || saved === 1 || saved === true;
          } catch (e) {
            st.expanded = true;
          }
          await load();
        }

        bridge.onInit(function (ctx) {
          document.documentElement.setAttribute('data-theme', ctx.theme === 'dark' ? 'dark' : 'light');
          void boot(ctx);
        });

        bridge.onContextUpdate(function (ctx) {
          document.documentElement.setAttribute('data-theme', ctx.theme === 'dark' ? 'dark' : 'light');
          var next = ctx.lessonId || '';
          if (next !== LESSON) {
            st.levels = [];
            st.editing = null;
            st.dirty = false;
            st.notice = '';
            void boot(ctx);
          }
        });

        bindEvents();
        resize();
        window.addEventListener('load', resize);
        if (typeof ResizeObserver === 'function') {
          new ResizeObserver(resize).observe(document.body);
        }
      })();
    </script>
  </body>
</html>
